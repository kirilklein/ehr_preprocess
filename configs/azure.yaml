test: false
env: azure
run_name: ehr_preprocess
data_store: "researcher_data"
paths:
  output_dir: outputs/ehr_preprocess
  file_type: parquet
  dump_path: 'data-backup/SP-dumps/2024-09-10'

# filtering:
#   filter_date: '2022-01-01'

preprocessor:
  _target_: preprocessors.azure.AzurePreprocessor


